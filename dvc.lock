      md5: 69ef922b5fcafcd49097cfc09e07167e
      size: 11979363
    - path: src/prepare.py
      hash: md5
      md5: baf7aabcb11037a2f78ecda67b63f501
      size: 6665
    params:
      configs/params.yaml:
        prepare:
          raw_path: data/raw/energydata_complete.csv
          output_dir: data/processed
          target: Appliances
          horizon: 1
          drop_columns: []
          temporal_features: true
          lags:
          - 1
          - 2
          - 3
          - 6
          - 12
          - 18
          - 36
          - 72
          - 144
          rolling_windows:
          - 3
          - 6
          - 12
          - 36
          - 72
          - 144
          - 288
          env_lags:
            T_out:
            - 1
            - 3
            - 6
            - 12
            - 144
            RH_out:
            - 1
            - 3
            - 6
            - 12
            - 144
            Windspeed:
            - 1
            - 3
            - 6
            - 12
            - 144
            Tdewpoint:
            - 1
            - 3
            - 6
            - 12
            - 144
          train_frac: 0.7
          val_frac: 0.15
    outs:
    - path: data/processed
      hash: md5
      md5: 4a5a2fca54472d52222fe272c997eb19.dir
      size: 19475511
      nfiles: 3
  train:
    cmd: python -m src.train --params configs/params.yaml
