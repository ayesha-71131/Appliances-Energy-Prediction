    - path: data/processed
      hash: md5
      md5: 4a5a2fca54472d52222fe272c997eb19.dir
      size: 19475511
      nfiles: 3
    - path: src/train.py
      hash: md5
      md5: 21ed03fd99754358be2acfbbe37535d9
      size: 2502
    params:
      configs/params.yaml:
        seed: 42
        train:
          model: hist_gradient_boosting
          data_dir: data/processed
          model_path: models/model.joblib
          random_forest:
            n_estimators: 200
            max_depth: 12
            min_samples_leaf: 5
          hist_gradient_boosting:
            loss: absolute_error
            learning_rate: 0.1
            max_iter: 300
            max_depth:
            min_samples_leaf: 100
            max_leaf_nodes: 31
            l2_regularization: 0
            early_stopping: false
            max_features: 0.8
    outs:
    - path: models/model.joblib
      hash: md5
      md5: c0bb121eea89f974c559f94145d4ed23
