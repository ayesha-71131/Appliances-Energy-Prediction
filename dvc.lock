schema: '2.0'
stages:
  validate:
    cmd: python src/data_checks.py data/raw/energydata_complete.csv
    deps:
    - path: data/raw/energydata_complete.csv
      hash: md5
      md5: 69ef922b5fcafcd49097cfc09e07167e
      size: 11979363
    - path: src/data_checks.py
      hash: md5
      md5: 2b307d80175efc0b3e2ef8db024f900d
      size: 4532
  prepare:
    cmd: python src/prepare.py --params configs/params.yaml
